version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecogenius-db
    environment:
      POSTGRES_DB: ecogenius
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecogenius-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ecogenius
      LLM_API_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecogenius-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    depends_on:
      - backend

volumes:
  pgdata:
